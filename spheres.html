<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medium Sized World · Spheres</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Space+Grotesk:wght@500&display=swap">
<style>
/* FK Raster Grotesk shows where it is installed; Space Grotesk stands in elsewhere. */
@font-face{font-family:"Raster";src:local("FK Raster Grotesk Compact Smooth"),local("FKRasterGroteskCompact-Smooth"),local("FK Raster Grotesk Compact")}
:root{--ink:#0d0d0d;--soft:#777;--green:#00b347;--hl:#c8ffd9;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Inter Tight",system-ui,sans-serif}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 24px;z-index:5;pointer-events:none}
.top a,.top span{pointer-events:auto}
.top a{color:var(--green);text-decoration:none}
.top a:hover{text-decoration:underline}
.top span{color:var(--soft);font-size:13px}
#field{position:fixed;inset:0}
.sph{position:absolute;left:0;top:0;border-radius:50%;overflow:hidden;will-change:transform;
 box-shadow:0 22px 40px -18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06)}
.sph video{position:absolute;inset:-14%;width:128%;height:128%;object-fit:cover;filter:saturate(1.1) contrast(1.05)}
/* shading and reflections that make a flat disc read as a glossy sphere */
.sph::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
 background:radial-gradient(circle at 50% 50%,transparent 52%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.55) 100%),
 radial-gradient(ellipse 60% 40% at 50% 104%,rgba(200,255,217,.45),transparent 70%)}
.sph::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
 background:radial-gradient(ellipse 34% 22% at 34% 24%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,transparent 75%),
 radial-gradient(circle at 70% 78%,rgba(255,255,255,.18),transparent 30%),
 linear-gradient(160deg,rgba(255,255,255,.22),transparent 38%)}
.sph.empty{background:radial-gradient(circle at 36% 30%,#ffffff 0,#f1f4f2 22%,#cfd8d2 52%,#9aa59e 82%,#7f8a83 100%)}
.sph.empty::before{background:radial-gradient(circle at 50% 50%,transparent 58%,rgba(0,0,0,.12) 100%),
 radial-gradient(ellipse 70% 30% at 50% 100%,rgba(200,255,217,.7),transparent 70%),
 linear-gradient(180deg,transparent 46%,rgba(255,255,255,.35) 48%,transparent 52%)}
.sph.vid{cursor:pointer}
.sph.vid:hover{box-shadow:0 22px 40px -18px rgba(0,0,0,.35),0 0 0 3px var(--hl)}
.sph .t{position:absolute;left:0;right:0;bottom:16%;text-align:center;z-index:4;color:#fff;font:500 13px "Raster","Space Grotesk",sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none}
.sph.vid:hover .t,.sph.vid:focus-visible .t{opacity:1}
.sph:focus-visible{outline:2px dashed var(--green);outline-offset:4px}
.modal{position:fixed;inset:0;z-index:10;background:rgba(255,255,255,.9);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.box{position:relative;width:min(1200px,100%);max-height:calc(100vh - 48px);border:4px solid var(--hl);border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.box video{display:block;width:100%;max-height:calc(100vh - 56px);background:#000}
.box h2{position:absolute;left:22px;top:16px;margin:0;z-index:2;color:var(--green);font:500 clamp(22px,3.4vw,44px)/1 "Raster","Space Grotesk",sans-serif;letter-spacing:.01em;pointer-events:none;text-shadow:0 0 18px rgba(0,0,0,.35)}
.x{all:unset;position:absolute;right:14px;top:10px;z-index:3;cursor:pointer;color:var(--hl);font-size:30px;line-height:1;padding:4px 8px}
.x:focus-visible{outline:1px dashed var(--hl)}
@media (max-width:640px){.top{padding:14px 16px}.box h2{left:14px;top:10px}}
</style></head><body>
<div class="top"><a href="./">← Medium Sized World</a><span id="count"></span></div>
<div id="field" aria-label="Video spheres"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box"><h2 id="mt"></h2><button class="x" id="x" aria-label="Close video">×</button><video id="mv" controls playsinline></video></div></div>
<script>
const STILL=matchMedia("(prefers-reduced-motion: reduce)").matches;
const TOTAL=12; // spheres on the page; videos fill them in order, the rest stay empty
const field=document.getElementById("field"),modal=document.getElementById("modal"),mv=document.getElementById("mv");
let B=[];
function build(vids){
 const n=Math.max(TOTAL,vids.length+3),W=innerWidth,H=innerHeight;
 const base=Math.sqrt(W*H*.30/(n*Math.PI));
 B=Array.from({length:n},(_,i)=>{const v=vids[i],r=base*(v?1.15:.7+Math.random()*.5);
  const el=document.createElement("div");el.className="sph "+(v?"vid":"empty");el.style.width=el.style.height=2*r+"px";
  if(v){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","Play "+v.title);
   el.innerHTML=`<video src="${v.loop}" ${v.poster?`poster="${v.poster}"`:""} muted loop autoplay playsinline preload="auto"></video><span class="t">${v.title.replace(/[&<>]/g,"")}</span>`;
   const open=()=>openVid(v);el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}}
  field.appendChild(el);
  const a=Math.random()*Math.PI*2,sp=(STILL?0:.5+Math.random()*.7);
  return {el,r,m:r*r,x:r+Math.random()*(W-2*r),y:r+Math.random()*(H-2*r),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ph:Math.random()*6}});
 // spread out any spheres that start on top of each other
 for(let k=0;k<200;k++)collide(true);
 document.getElementById("count").textContent=`${vids.length} of ${n} spheres hold a world`;
}
function collide(sep){
 for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=a.r+b.r;
  if(d<min){const nx=dx/d,ny=dy/d,o=(min-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
   if(!sep){const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=2*rv/(a.m+b.m);a.vx+=imp*b.m*nx;a.vy+=imp*b.m*ny;b.vx-=imp*a.m*nx;b.vy-=imp*a.m*ny}}}}
}
function frame(ms){const W=innerWidth,H=innerHeight,t=ms/1000;
 B.forEach(b=>{b.x+=b.vx;b.y+=b.vy;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)}
  // keep a gentle, even pace like balls on felt that never quite stop
  const s=Math.hypot(b.vx,b.vy);if(s>0){const k=s<.45?1.01:s>1.4?.99:1;b.vx*=k;b.vy*=k}});
 collide(false);
 B.forEach(b=>{const bob=STILL?0:Math.sin(t*1.2+b.ph)*3;b.el.style.transform=`translate(${(b.x-b.r).toFixed(1)}px,${(b.y-b.r+bob).toFixed(1)}px)`});
 requestAnimationFrame(frame)}
function openVid(v){document.getElementById("mt").textContent=v.title;mv.src=v.src;if(v.poster)mv.poster=v.poster;modal.classList.add("on");mv.play().catch(()=>{});document.getElementById("x").focus()}
function closeVid(){modal.classList.remove("on");mv.pause();mv.removeAttribute("src");mv.load()}
modal.onclick=e=>{if(e.target===modal)closeVid()};document.getElementById("x").onclick=closeVid;
addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("on"))closeVid()});
addEventListener("resize",()=>B.forEach(b=>{b.x=Math.min(b.x,innerWidth-b.r);b.y=Math.min(b.y,innerHeight-b.r)}));
fetch("videos/videos.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).catch(()=>[]).then(v=>{build(v);requestAnimationFrame(frame)});
</script></body></html>
